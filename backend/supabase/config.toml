# Supabase CLI Project Configuration: Legal Helper Backend
project_id = "legal-helper-backend"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_role = "anon"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://legalhelper.app/**", "legalhelper://auth-callback/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"

[storage]
enabled = true
file_size_limit = "100MiB"

[edge_runtime]
enabled = true
port = 54324
inspector_port = 8083

[analytics]
enabled = false

